apiVersion: apps/v1
kind: Deployment
metadata:
  name: p2p-backend
  labels:
    app: p2p-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: p2p-backend
  template:
    metadata:
      labels:
        app: p2p-backend
    spec:
      containers:
        - name: signaling-server
          image: secure-p2p/backend:1.0.0
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: NODE_ENV
              value: "production"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: p2p-secrets
                  key: jwt-secret
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: p2p-backend-svc
spec:
  selector:
    app: p2p-backend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
